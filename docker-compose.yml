services:
  itguard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: itguard
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
      - "3000:3000/tcp"
    volumes:
      - ./itguard_work:/opt/itguard/work
      - ./itguard_conf:/opt/itguard/conf

